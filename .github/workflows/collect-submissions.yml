name: Collect Lab 01 submissions
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  issues: read
jobs:
  collect:
    if: contains(github.event.issue.labels.*.name, 'lab01-submission')
    runs-on: ubuntu-latest
    concurrency:
      group: dart-quest-submissions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and update JSON
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python scripts/collect_submission.py
      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submissions.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Dart Quest submissions"
            git push
          fi
